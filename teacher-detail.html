<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>正在打开老师主页</title>
  <link rel="stylesheet" href="styles.css?v=0.15.47">
</head>
<body data-staff-detail>
  <main class="staff-detail-main">
    <section class="staff-profile-error" aria-live="polite">
      <strong>正在打开老师主页…</strong>
      <span>老师资料、人脸、体验额度和账号操作统一在新主页中管理。</span>
    </section>
  </main>
  <script>
    (() => {
      const query = new URLSearchParams(location.search);
      const id = query.get("id") || query.get("teacherId") || query.get("teacherCode") || "";
      const destination = id
        ? `staff-detail.html?role=teacher&id=${encodeURIComponent(id)}`
        : "teacher-management.html";
      location.replace(destination);
    })();
  </script>
</body>
</html>
