<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>门店管理</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-management="store">
  <aside class="side-project-bar" aria-label="项目栏">
    <div class="side-brand"><span>HQ</span><div><strong>总部工作区</strong><small>项目栏</small></div></div>
    <nav class="side-nav"></nav>
    <div class="side-footer">总部权限</div>
  </aside>
  <header class="topbar">
    <div>
      <p class="eyebrow">STORE MANAGEMENT</p>
      <h1>门店管理</h1>
      <p class="subtitle">默认显示全部门店；可按联系人电话筛选，点击门店名称进入门店全局视图。</p>
    </div>
    <div class="status"><span></span>总部权限</div>
  </header>
  <main>
    <section class="panel store-directory-toolbar">
      <label>按联系人电话查询<input id="entityPhoneSearch" type="search" inputmode="tel" autocomplete="off" placeholder="输入完整或部分联系人电话"></label>
      <div class="toolbar-actions">
        <button id="searchPeople" type="button">查询</button>
        <button id="addEntity" type="button">新增门店</button>
      </div>
    </section>
    <section id="storeDirectory" class="store-directory-grid" aria-live="polite">
      <section class="panel store-directory-panel">
        <div class="panel-heading">
          <div><h2>活跃门店</h2></div>
          <span id="activeStoreCount" class="badge">0 家</span>
        </div>
        <div class="store-directory-window">
          <table class="store-directory-table">
            <colgroup><col class="store-name-column"><col class="store-contact-column"><col class="store-phone-column"><col class="store-address-column"></colgroup>
            <thead><tr><th>门店名称</th><th>联系人</th><th>联系电话</th><th>完整地址</th></tr></thead>
            <tbody id="activeStoreRows"><tr><td colspan="4" class="store-directory-empty">正在读取门店数据…</td></tr></tbody>
          </table>
        </div>
      </section>
      <section class="panel store-directory-panel">
        <div class="panel-heading">
          <div><h2>封存门店</h2></div>
          <span id="archivedStoreCount" class="badge">0 家</span>
        </div>
        <div class="store-directory-window">
          <table class="store-directory-table">
            <colgroup><col class="store-name-column"><col class="store-contact-column"><col class="store-phone-column"><col class="store-address-column"></colgroup>
            <thead><tr><th>门店名称</th><th>联系人</th><th>联系电话</th><th>完整地址</th></tr></thead>
            <tbody id="archivedStoreRows"><tr><td colspan="4" class="store-directory-empty">正在读取门店数据…</td></tr></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.js"></script>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.auth.js"></script>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.functions.js"></script>
  <script src="cloudbase-auth-config.js"></script>
  <script src="cloudbase-phone-auth.js?v=0.17.0"></script>
  <script src="store-management.js?v=0.14.22"></script>
  <script src="auth-ui.js?v=0.17.1"></script>
</body>
</html>
