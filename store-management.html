<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>门店管理</title><link rel="stylesheet" href="styles.css"></head>
<body data-management="store">
  <aside class="side-project-bar" aria-label="项目栏"><div class="side-brand"><span>HQ</span><div><strong>总部工作区</strong><small>项目栏</small></div></div><nav class="side-nav"></nav><div class="side-footer">总部权限</div></aside>
  <header class="topbar"><div><p class="eyebrow">STORE MANAGEMENT</p><h1>门店管理</h1><p class="subtitle">按门店名称、联系人电话或已有门店查询；点击结果查看门店详情。</p></div><div class="status"><span></span>总部权限</div></header>
  <main><section class="panel management-toolbar people-search-toolbar"><label>按门店名称查询<input id="entityNameSearch" type="search" autocomplete="off" placeholder="输入完整或部分门店名称"></label><label>按联系人电话查询<input id="entityPhoneSearch" type="search" inputmode="tel" autocomplete="off" placeholder="输入完整或部分联系电话"></label><label>直接选择系统已有门店<select id="entitySelect"><option value="">请选择门店</option></select></label><div class="toolbar-actions"><button id="searchPeople" type="button">按条件搜索</button><button id="selectPeople" type="button" class="secondary-button">查看所选</button><button id="addEntity" type="button">新增门店</button></div></section><section id="entityInfo" class="management-summary"></section></main>
  <script src="management.js"></script><script src="auth-ui.js"></script>
</body></html>
