<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>老师办理充值</title>
  <link rel="stylesheet" href="styles.css?v=0.15.44">
</head>
<body data-store-business="recharge" data-teacher-business>
  <aside class="side-project-bar" aria-label="老师工作台"><div class="side-brand"><span>师</span><div><strong>老师工作台</strong><small>本人业务</small></div></div><nav class="side-nav"></nav><div class="side-footer">老师账号</div></aside>
  <header class="topbar"><div><p class="eyebrow">TEACHER RECHARGE</p><h1>办理充值</h1><p class="subtitle">先选择门店，再按门店流程确认客户并提交充值</p></div><div class="status"><span></span>绑定当前老师</div></header>
  <main class="teacher-business-main">
    <section class="panel teacher-business-store-panel">
      <div class="panel-heading"><div><h2>选择本次办理门店</h2><p>门店只对本次办理生效；提交后工单自动绑定当前老师</p></div><span id="teacherBusinessStoreState" class="badge">尚未选择</span></div>
      <div class="teacher-business-store-row"><label>当前老师<strong id="teacherBusinessIdentity">正在确认身份…</strong></label><label>办理门店<select id="teacherBusinessStore"><option value="">正在读取可用门店…</option></select></label><button id="confirmTeacherBusinessStore" type="button" disabled>确认门店</button></div>
      <p id="teacherBusinessStoreMessage" class="form-message"></p>
    </section>
    <div class="store-business-main store-workflow-main">
      <section id="teacherCustomerWorkflow" class="panel store-business-form workflow-lookup-panel teacher-step-disabled">
        <div class="panel-heading"><div><h2>第一步：查找并确认客户</h2></div><span class="badge">本门店 · 活跃</span></div>
        <div class="lookup-mode-switch" role="tablist" aria-label="客户查找方式"><button class="active" type="button" data-lookup-mode="select">现有客户下拉框＋生日</button><button type="button" data-lookup-mode="manual">手动输入姓名＋生日</button></div>
        <div id="selectLookupFields" class="customer-lookup-grid"><label>现有客户<select id="serviceCustomerSelect"></select></label><label>生日<input id="serviceSelectBirthday" type="date" readonly aria-readonly="true"></label><button id="serviceSelectLookup" type="button">查询客户</button></div>
        <div id="manualLookupFields" class="customer-lookup-grid" hidden><label>客户姓名<input id="serviceCustomerName" placeholder="手动输入客户姓名"></label><label>生日<input id="serviceCustomerBirthday" type="date"></label><button id="serviceCustomerLookup" type="button">查询客户</button></div>
        <div id="serviceCustomerResults" class="service-customer-results customer-core-preview"><div class="lookup-placeholder"><strong>等待选择门店</strong><span>选择门店后，此处显示客户建档照片、姓名、生日和客户编号。</span></div></div>
        <button id="confirmCustomerSelection" class="confirm-customer-button" type="button" disabled>确认此客户并进入充值</button>
      </section>
      <form id="rechargeCreateForm" class="panel store-business-form workflow-action-panel business-step-disabled">
        <div class="panel-heading"><div><h2>第二步：填写充值信息</h2><p id="selectedCustomerText"></p></div><span class="badge">充值</span></div>
        <div class="store-business-grid"><label>项目<select id="rechargeProject" required></select></label><label>当前老师（自动绑定）<select id="rechargeTeacher" required></select></label><label>充值次数<input id="rechargeCount" type="number" min="1" max="999" value="10" required></label><label class="full-field">老师留言<textarea id="rechargeNote" rows="3" maxlength="500" placeholder="可给审核人员留言"></textarea></label></div>
        <div class="form-submit-row"><span id="rechargeCreateMessage"></span><button type="submit">提交充值申请</button></div>
      </form>
    </div>
  </main>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.js"></script>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.auth.js"></script>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.functions.js"></script>
  <script src="cloudbase-auth-config.js"></script>
  <script src="store-business.js?v=0.14.56"></script>
  <script src="auth-ui.js?v=0.19.3"></script>
</body>
</html>
