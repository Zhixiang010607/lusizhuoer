<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>运营管理</title><link rel="stylesheet" href="styles.css"></head>
<body data-management="operation"><aside class="side-project-bar" aria-label="项目栏"><div class="side-brand"><span>HQ</span><div><strong>总部工作区</strong><small>项目栏</small></div></div><p class="side-section-title">总部管理</p><nav class="side-nav"></nav><div class="side-footer">静态原型 v0.14.19</div></aside>
<header class="topbar"><div><p class="eyebrow">OPERATION MANAGEMENT</p><h1>运营管理</h1><p class="subtitle">创建、查看和封存运营账号；不提供删除操作</p></div><div class="status"><span></span>总部权限</div></header>
<main><section class="panel management-toolbar"><label>姓名或身份证查询<input id="entitySearch" type="search" autocomplete="off" placeholder="输入姓名或完整身份证号码"></label><label>选择运营账号<select id="entitySelect"></select></label><label>时间周期<select id="managePeriod"><option value="last30">近30日</option><option value="ytd">本年截至今天</option></select></label><div class="toolbar-actions"><button id="addEntity">新增运营账号</button><button id="deleteEntity" class="danger-button">封存运营账号</button></div></section><section id="entityInfo" class="management-summary"></section><section class="panel customer-permission-banner"><strong>账号管理规则</strong><span>姓名查询结果同步显示身份证号码，以身份证作为唯一标识；账号可创建、查看和封存，不提供删除操作。</span></section></main>
<dialog id="entityDialog"><form id="entityForm" method="dialog"><div class="dialog-heading"><h2>新增运营账号</h2><button value="cancel" aria-label="关闭">×</button></div><label>账号名称<input id="entityName" required maxlength="50"></label><label>账号编号<input id="entityCode" required maxlength="20" placeholder="例如 OP009"></label><label>运营人员姓名<input id="entityExtra" maxlength="50"></label><div class="dialog-actions"><button value="cancel" type="button" id="cancelEntity">取消</button><button value="default" type="submit">保存</button></div></form></dialog><script src="management.js"></script><script src="auth-ui.js"></script></body></html>
