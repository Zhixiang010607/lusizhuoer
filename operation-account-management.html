<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>运营管理</title><link rel="stylesheet" href="styles.css?v=0.15.40"></head>
<body data-management="operation"><aside class="side-project-bar" aria-label="项目栏"><div class="side-brand"><span>HQ</span><div><strong>总部工作区</strong><small>项目栏</small></div></div><p class="side-section-title">总部管理</p><nav class="side-nav"></nav><div class="side-footer">静态原型 v0.14.19</div></aside>
<header class="topbar"><div><p class="eyebrow">OPERATION MANAGEMENT</p><h1>运营管理</h1><p class="subtitle">按姓名、联系电话或系统已有运营人员查询；可新增、查看和封存，不提供删除操作</p></div><div class="status"><span></span>总部权限</div></header>
<main><section class="panel management-toolbar people-search-toolbar"><label>按姓名查询<input id="entityNameSearch" type="search" autocomplete="off" placeholder="输入姓名；同名运营人员会全部显示"></label><label>按联系电话查询<input id="entityPhoneSearch" type="search" inputmode="tel" autocomplete="off" placeholder="输入完整或部分联系电话"></label><label>直接选择系统已有运营人员<select id="entitySelect"><option value="">请选择运营人员</option></select></label><div class="toolbar-actions"><button id="searchPeople" type="button">按条件搜索</button><button id="addEntity">新增运营</button></div></section><section id="entityInfo" class="management-summary"></section><section class="panel customer-permission-banner"><strong>账号管理规则</strong><span>一个手机号只能对应一个业务身份。姓名查询会展示所有同名人员；账号可创建、查看和封存，不提供删除操作。</span></section></main>
<dialog id="entityDialog"><form id="entityForm" method="dialog"><div class="dialog-heading"><h2>新增运营账号</h2><button value="cancel" aria-label="关闭">×</button></div><label>账号名称<input id="entityName" required maxlength="50"></label><label>账号编号<input id="entityCode" required maxlength="20" placeholder="例如 OP009"></label><label>运营人员姓名<input id="entityExtra" maxlength="50"></label><div class="dialog-actions"><button value="cancel" type="button" id="cancelEntity">取消</button><button value="default" type="submit">保存</button></div></form></dialog><script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.js"></script><script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.auth.js"></script><script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.functions.js"></script><script src="cloudbase-auth-config.js"></script><script src="cloudbase-phone-auth.js?v=0.17.7"></script><script src="datetime.js?v=0.1.2"></script><script src="management.js?v=0.14.23"></script><script src="auth-ui.js?v=0.18.6"></script></body></html>
