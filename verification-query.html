<header class="topbar"><div><p class="eyebrow">BUSINESS RECORD QUERY</p><h1>核销查询</h1><p class="subtitle">选择现有客户，或手动输入姓名查询全部同名客户</p></div><div class="status"><span></span>本地模式</div></header>
<main><section class="panel query-filter-panel"><div class="record-query-grid"><label>门店<select id="queryStore"></select></label><div class="record-customer-filter"><span class="field-label">客户查找方式</span><div class="lookup-mode-switch query-lookup-switch"><button class="active" type="button" data-query-mode="select">选择现有客户</button><button type="button" data-query-mode="manual">手动输入姓名＋生日</button></div></div><label id="querySelectCustomerField">现有客户<select id="queryCustomerSelect"></select></label><label id="querySelectBirthdayField">生日<input id="querySelectBirthday" readonly placeholder="选择客户后显示"></label><label id="queryManualCustomerField" hidden>客户姓名<input id="queryCustomerManual" placeholder="输入姓名；同名客户全部显示"></label><label id="queryManualBirthdayField" hidden>生日<input id="queryCustomerBirthday" type="date"></label><label>项目名称<select id="queryProject"></select></label><label>时间范围<select id="queryTimeRange"><option value="sevenDays">近 7 天</option><option value="month">近 1 个月</option><option value="quarter">本季度</option><option value="year">本年度</option><option value="custom" selected>自定义：过去一年</option></select></label><label>开始日期<input id="queryDateStart" type="date"></label><label>结束日期<input id="queryDateEnd" type="date"></label></div><div id="queryCustomerMatches" class="query-customer-matches">选择具体客户可按客户编号精确查询。</div><div class="query-filter-actions"><span id="querySummary">0条记录</span><button id="resetQuery">重置条件</button></div></section>
<section class="panel table-card query-results"><div class="panel-heading"><div><h2>核销记录</h2></div><span class="badge">核销</span></div><div class="table-scroll"><table><thead><tr><th>核销编号（可查看）</th><th>客户编号</th><th>客户姓名</th><th>生日</th><th>门店</th><th>项目</th><th>老师</th><th>提交时间</th><th>照片</th><th>状态</th><th>审核进度</th></tr></thead><tbody id="queryBody"></tbody></table></div></section></main><script src="query.js"></script><script src="auth-ui.js"></script></body></html>
