<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>人员主页</title>
  <link rel="stylesheet" href="styles.css?v=0.15.61">
  <link rel="stylesheet" href="web-tablet-parity.css?v=1.0.12" data-web-tablet-parity>
  <link rel="stylesheet" href="attendance-photo.css?v=1.0.0">
</head>
<body data-staff-detail>
  <aside class="side-project-bar" aria-label="项目栏">
    <div class="side-brand"><span>HQ</span><div><strong>总部工作区</strong><small>项目栏</small></div></div>
    <nav class="side-nav"></nav>
    <div class="side-footer">总部权限</div>
  </aside>

  <header class="topbar staff-detail-topbar">
    <div>
      <p id="staffDetailEyebrow" class="staff-page-kicker">ACCOUNT PROFILE</p>
      <h1 id="staffDetailTitle">人员主页</h1>
      <p id="staffDetailSubtitle" class="staff-page-description">总部可在这里查看人员档案与账号安全。</p>
    </div>
    <a class="button-link secondary-button" id="backToManagement" href="index.html">返回账号管理</a>
  </header>

  <main class="staff-detail-main">
    <nav id="staffSectionTabs" class="staff-section-tabs" role="tablist" aria-label="老师主页栏目" hidden>
      <button type="button" class="active" data-staff-section="basic" role="tab" aria-selected="true">基本资料</button>
      <button type="button" data-staff-section="configuration" role="tab" aria-selected="false">项目配置</button>
      <button type="button" data-staff-section="work" role="tab" aria-selected="false">考勤日报</button>
    </nav>

    <section id="staffBasicSection" class="staff-detail-section">
    <section class="staff-profile-workspace" aria-label="人员档案与账号管理">
      <section id="staffDetailContent" class="staff-profile-shell" aria-live="polite">
        <div class="staff-profile-loading">正在读取人员资料…</div>
      </section>
      <aside class="panel staff-status-panel" aria-labelledby="staffSecurityTitle">
        <div>
          <p class="staff-panel-kicker">账号与安全</p>
          <h2 id="staffSecurityTitle">人员账号管理</h2>
          <p id="staffStatusHint">正在读取人员信息。</p>
        </div>
        <div class="staff-admin-actions">
          <button id="staffCredentialAction" class="secondary-button" type="button" hidden>重置临时密码</button>
          <button id="staffStatusAction" class="danger-button" type="button" hidden>封存人员</button>
        </div>
      </aside>
    </section>
    </section>

    <section id="staffConfigurationSection" class="staff-detail-section" hidden>
    <section id="teacherExperiencePanel" class="panel teacher-experience-panel" hidden aria-labelledby="teacherExperienceTitle">
      <header class="teacher-experience-heading">
        <div>
          <h2 id="teacherExperienceTitle">配置项目当月汇总</h2>
        </div>
        <span id="teacherExperienceState" class="teacher-experience-state">正在读取</span>
      </header>

      <div id="teacherExperienceOverview" class="teacher-experience-overview" aria-live="polite" aria-busy="true"></div>

      <div class="teacher-experience-workspace">
        <section class="teacher-experience-list-card" aria-labelledby="teacherExperienceListTitle">
          <header class="teacher-experience-section-heading teacher-experience-summary-heading">
            <div>
              <h3 id="teacherExperienceListTitle">项目体验汇总</h3>
            </div>
          </header>
          <div id="teacherExperienceSummaryRows" class="teacher-experience-summary-grid" aria-live="polite">
            <div class="teacher-experience-empty">正在汇总各项目体验次数…</div>
          </div>

          <header class="teacher-experience-section-heading teacher-experience-configured-heading">
            <div>
              <h3>已配置项目</h3>
            </div>
          </header>
          <div id="teacherExperienceRows" class="teacher-experience-quota-grid" aria-live="polite">
            <div class="teacher-experience-empty">正在读取体验额度…</div>
          </div>
        </section>

        <aside class="teacher-experience-action-stack">
          <section class="teacher-experience-config" aria-labelledby="teacherExperienceConfigTitle">
            <div class="teacher-experience-action-copy">
              <h3 id="teacherExperienceConfigTitle">配置新产品</h3>
            </div>
            <form id="teacherExperienceConfigForm" class="teacher-experience-form">
              <label>活跃产品<select id="teacherExperienceProduct" required disabled><option value="">正在读取可配置产品…</option></select></label>
              <label>立即生效次数<input id="teacherExperienceMonthlyCount" type="number" min="0" max="99999" step="1" required inputmode="numeric" placeholder="例如 30"></label>
              <button id="saveTeacherExperienceConfig" type="submit">保存并立即生效</button>
            </form>
            <p id="teacherExperienceConfigMessage" class="form-message" aria-live="polite"></p>
          </section>

          <section id="teacherExperienceRechargePanel" class="teacher-experience-recharge" aria-labelledby="teacherExperienceRechargeTitle">
            <div class="teacher-experience-action-copy">
              <h3 id="teacherExperienceRechargeTitle">单独充值体验次数</h3>
              <p id="teacherExperienceRechargeTarget"></p>
            </div>
            <form id="teacherExperienceRechargeForm" class="teacher-experience-form">
              <label>已配置产品<select id="teacherExperienceRechargeProduct" required disabled><option value="">正在读取可充值产品…</option></select></label>
              <label>充值次数<input id="teacherExperienceRechargeCount" type="number" min="1" max="99999" step="1" required inputmode="numeric" placeholder="例如 5"></label>
              <label>充值备注<textarea id="teacherExperienceRechargeNote" rows="3" maxlength="300" placeholder="可选，记录本次单独充值原因"></textarea></label>
              <div class="teacher-experience-form-actions">
                <button id="saveTeacherExperienceRecharge" type="submit">确认充值</button>
                <button id="cancelTeacherExperienceRecharge" class="secondary-button" type="button">清空</button>
              </div>
            </form>
            <p id="teacherExperienceRechargeMessage" class="form-message" aria-live="polite"></p>
          </section>
        </aside>
      </div>

      <section class="teacher-experience-history-card" aria-labelledby="teacherExperienceHistoryTitle">
        <header class="teacher-experience-section-heading">
          <div>
            <h3 id="teacherExperienceHistoryTitle">最近额度变更</h3>
          </div>
        </header>
        <div id="teacherExperienceHistoryRows" class="teacher-experience-history-list" aria-live="polite">
          <div class="teacher-experience-empty">正在读取体验额度历史…</div>
        </div>
      </section>
    </section>
    </section>

    <section id="staffWorkSection" class="staff-detail-section staff-work-section" hidden>
      <div class="staff-work-mode-tabs" role="tablist" aria-label="考勤日报类型">
        <button type="button" class="active" data-work-mode="attendance" role="tab" aria-selected="true">考勤月历</button>
        <button type="button" data-work-mode="report" role="tab" aria-selected="false">日报月历</button>
      </div>
      <section class="panel staff-work-calendar-panel">
        <div class="panel-heading"><div><h2 id="staffWorkCalendarTitle">考勤月历</h2></div><span id="staffWorkState" class="badge">尚未读取</span></div>
        <div class="staff-work-month-controls">
          <button type="button" class="secondary-button" data-work-shift="-12">上一年</button>
          <button type="button" class="secondary-button" data-work-shift="-1">上月</button>
          <label><span>年份</span><select id="staffWorkYear" aria-label="选择年份"></select></label>
          <label><span>月份</span><select id="staffWorkMonth" aria-label="选择月份"></select></label>
          <button type="button" class="secondary-button" data-work-shift="1">下月</button>
          <button type="button" class="secondary-button" data-work-shift="12">下一年</button>
        </div>
        <div id="staffWorkLegend" class="staff-work-legend"></div>
        <div class="staff-work-weekdays" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
        <div id="staffWorkCalendar" class="staff-work-calendar" role="grid" aria-label="老师考勤日报月历"></div>
      </section>
      <section id="staffWorkDayPanel" class="panel staff-work-day-panel">
        <div class="panel-heading"><div><h2 id="staffWorkDayTitle">请选择日期</h2></div><span id="staffWorkDayState" class="badge">—</span></div>
        <div id="staffWorkDayContent" class="staff-work-day-content"><p class="staff-work-empty">选择月历中的日期查看详情</p></div>
      </section>
    </section>
  </main>

  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.js"></script>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.auth.js"></script>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.functions.js"></script>
  <script src="cloudbase-auth-config.js"></script>
  <script src="cloudbase-phone-auth.js?v=0.20.7"></script>
  <script src="datetime.js?v=0.1.2"></script>
  <script src="web-work-common.js?v=1.0.0"></script>
  <script src="attendance-photo.js?v=1.0.0"></script>
  <script src="staff-detail.js?v=0.15.15"></script>
  <script src="auth-ui.js?v=0.21.4"></script>
</body>
</html>
