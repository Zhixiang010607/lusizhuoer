<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>退费审核</title>
  <link rel="stylesheet" href="styles.css?v=0.15.44">
</head>
<body data-review="refund">
  <aside class="side-project-bar" aria-label="项目栏">
    <div class="side-brand"><span>HQ</span><div><strong>总部工作台</strong><small>项目栏</small></div></div>
    <p class="side-section-title">数据看板</p>
    <nav class="side-nav"><a href="index.html"><span class="nav-icon">全</span><span>全局视图</span></a></nav>
    <details class="side-menu-group" open data-menu="review">
      <summary><span class="nav-icon">审</span><span>审核</span></summary>
      <nav><a href="recharge-review.html">充值审核</a><a class="active" href="refund-review.html">退费审核</a></nav>
    </details>
    <div class="side-footer">总部工作台</div>
  </aside>

  <header class="topbar">
    <div><p class="eyebrow">REFUND REVIEW</p><h1>退费审核</h1><p class="subtitle">审核门店或老师提交的退费申请</p></div>
    <div class="status"><span></span>总部审核权限</div>
  </header>

  <main>
    <section class="panel review-toolbar">
      <div class="review-query-mode" role="tablist" aria-label="审核查询方式">
        <button id="reviewModeFilters" class="active" type="button" role="tab" aria-selected="true">按条件查询</button>
        <button id="reviewModeCode" type="button" role="tab" aria-selected="false">按编号查询</button>
      </div>
      <div id="reviewFilterPanel" class="review-filter-row review-query-panel">
        <label>门店<select id="reviewStore"></select></label>
        <label>审核状态<select id="reviewStatus"><option value="all" selected>全部状态</option><option value="pending">待审核</option><option value="approved">审核通过</option><option value="rejected">已驳回</option></select></label>
        <button id="reviewFilterSearch" class="primary-action" type="button">按条件查询</button>
      </div>
      <div id="reviewCodePanel" class="review-code-panel review-query-panel" hidden>
        <label>退费单编号<input id="reviewCode" type="search" maxlength="40" autocomplete="off" placeholder="输入完整退费单号"></label>
        <button id="reviewCodeSearch" class="primary-action" type="button">查询</button>
      </div>
      <div class="review-count" id="reviewCount"></div>
    </section>

    <section class="panel table-card review-table">
      <div class="panel-heading"><div><h2>退费审核记录</h2><p>这里只显示退费申请</p></div><span class="badge">退费</span></div>
      <div class="table-scroll">
        <table>
          <thead><tr><th>退费单号</th><th>类型</th><th>门店</th><th>客户</th><th>项目</th><th>老师</th><th>退费次数</th><th>提交时间</th><th>审核操作/结果</th><th>审核时间</th></tr></thead>
          <tbody id="reviewBody"></tbody>
        </table>
      </div>
      <div class="form-submit-row"><span></span><button id="reviewLoadMore" type="button" hidden>加载更多审核记录</button></div>
    </section>
  </main>

  <dialog id="reviewDialog">
    <div class="dialog-heading"><h2 id="reviewDialogTitle">审核确认</h2><button id="closeReviewDialog" aria-label="关闭">×</button></div>
    <div id="reviewDialogSummary" class="review-dialog-summary"></div>
    <div><strong>沟通记录</strong><div id="reviewCommunicationLog" class="communication-log compact-communication-log"></div></div>
    <label>审核留言／备注<textarea id="reviewNote" rows="3" maxlength="500" placeholder="可选：填写本次通过或驳回说明"></textarea></label>
    <div class="dialog-actions"><button id="cancelReview" type="button">取消</button><button id="confirmReview" type="button">确认</button></div>
  </dialog>

  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.js"></script>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.auth.js"></script>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.functions.js"></script>
  <script src="cloudbase-auth-config.js"></script>
  <script src="cloudbase-phone-auth.js?v=0.18.0"></script>
  <script src="datetime.js?v=0.1.2"></script>
  <script src="review.js?v=0.18.1"></script>
  <script src="auth-ui.js?v=0.19.0"></script>
</body>
</html>
