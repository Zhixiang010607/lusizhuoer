<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>老师工作台</title>
  <link rel="stylesheet" href="styles.css?v=0.15.37">
</head>
<body data-teacher-workspace>
  <aside class="side-project-bar" aria-label="老师工作台"><div class="side-brand"><span>师</span><div><strong>老师工作台</strong><small>本人业务</small></div></div><nav class="side-nav"></nav><div class="side-footer">老师账号</div></aside>
  <header class="topbar"><div><p class="eyebrow">MY WORKSPACE</p><h1>我的工作台</h1><p class="subtitle">只显示本人资料与本人绑定的充值、核销工单</p></div><div class="status"><span></span>仅本人数据</div></header>
  <main class="teacher-workspace-main">
    <section class="panel detail-section">
      <div class="panel-heading"><div><h2>我的基础信息</h2><p>身份由当前登录账号在数据库中确认</p></div><span class="badge">老师本人</span></div>
      <div id="teacherProfileInfo" class="detail-info-grid"><article><span>读取状态</span><strong>正在读取数据库…</strong></article></div>
    </section>
    <section class="panel teacher-business-panel">
      <div class="panel-heading"><div><h2>本人绑定工单</h2><p>客户仅作工单上下文展示，不提供客户主页入口</p></div><span id="teacherLoadedCount" class="badge">0 条</span></div>
      <div class="teacher-record-tabs" role="tablist" aria-label="工单类型"><button class="active" id="teacherVerificationTab" type="button" role="tab" aria-selected="true">我的核销</button><button id="teacherRechargeTab" type="button" role="tab" aria-selected="false">我的充值</button></div>
      <p id="teacherWorkspaceMessage" class="form-message" aria-live="polite"></p>
      <div class="table-scroll"><table><thead id="teacherRecordsHead"></thead><tbody id="teacherOrdersBody"><tr><td class="teacher-empty">正在读取数据库工单…</td></tr></tbody></table></div>
      <div class="teacher-load-more-row"><button id="teacherLoadMore" type="button" hidden>继续加载</button></div>
    </section>
  </main>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.js"></script>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.auth.js"></script>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.functions.js"></script>
  <script src="cloudbase-auth-config.js"></script>
  <script src="datetime.js?v=0.1.2"></script>
  <script src="teacher-work-orders.js?v=0.15.3"></script>
  <script src="auth-ui.js?v=0.18.5"></script>
</body>
</html>
