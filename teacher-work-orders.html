<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>我的工单</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-teacher-workspace>
  <aside class="side-project-bar" aria-label="老师工作台"><div class="side-brand"><span>师</span><div><strong>老师工作台</strong><small>个人业务</small></div></div><p class="side-section-title">我的工作</p><nav class="side-nav"><a class="active" href="teacher-work-orders.html"><span class="nav-icon">单</span><span>我的工单</span></a></nav><div class="side-footer">老师账号</div></aside>
  <header class="topbar"><div><p class="eyebrow">MY WORK ORDERS</p><h1>我的工单</h1><p class="subtitle">仅查看本人负责的工单</p></div><div class="status"><span></span>账号已登录</div></header>
  <main class="teacher-workspace-main">
    <section class="teacher-privacy-banner"><i>✓</i><div><strong>个人数据范围</strong><br>本页仅展示当前老师本人负责的工单；不显示门店资料、门店联系人或其他老师的任何工单。</div></section>
    <section id="teacherSummary" class="teacher-summary-grid" aria-label="我的工单统计"></section>
    <section class="teacher-work-layout">
      <article class="panel teacher-orders-panel"><div class="panel-heading"><div><h2>工单列表</h2><p>按当前老师账号自动筛选</p></div><span id="teacherOrderCount" class="badge"></span></div><div class="teacher-order-filters"><label>工单状态<select id="teacherOrderStatus"><option value="all">全部状态</option><option value="pending">待处理</option><option value="progress">处理中</option><option value="done">已完成</option></select></label><label>工单类型<select id="teacherOrderType"><option value="all">全部类型</option><option value="核销服务">核销服务</option><option value="课程服务">课程服务</option><option value="客户回访">客户回访</option></select></label><button id="clearTeacherFilters" type="button">重置筛选</button></div><div class="table-scroll"><table><thead><tr><th>工单号</th><th>类型</th><th>客户</th><th>预约时间</th><th>状态</th><th>操作</th></tr></thead><tbody id="teacherOrdersBody"></tbody></table></div></article>
      <aside class="panel teacher-today-panel"><div class="panel-heading"><div><h2>今日待办</h2><p>仅本人</p></div></div><div id="teacherTodayList" class="teacher-today-list"></div></aside>
    </section>
  </main>
  <script src="teacher-work-orders.js"></script><script src="auth-ui.js"></script>
</body>
</html>
