<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>老师创建</title>
  <link rel="stylesheet" href="styles.css?v=0.15.53">
</head>
<body data-hq-create="teacher" data-person-create="teacher">
  <aside class="side-project-bar" aria-label="项目栏"><div class="side-brand"><span>HQ</span><div><strong>总部工作台</strong><small>项目栏</small></div></div><p class="side-section-title">数据看板</p><nav class="side-nav"><a href="index.html"><span class="nav-icon">全</span><span>全局视图</span></a></nav><div class="side-footer">静态原型</div></aside>
  <header class="topbar"><div><p class="eyebrow">TEACHER CREATION</p><h1>老师创建</h1></div><div class="status"><span></span>总部专属</div></header>
  <main class="hq-create-main">
    <form id="personCreateForm" class="panel hq-create-form person-create-form" autocomplete="off">
      <section class="hq-create-section person-create-section">
        <div class="panel-heading">
          <div>
            <h2>老师账号资料</h2>
            <p>填写资料并现场拍摄老师正脸。账号、老师主档和考勤人脸档案必须整体创建成功。</p>
          </div>
          <span id="generatedPersonCode" class="badge">创建后自动生成编号</span>
        </div>
        <div class="hq-create-grid">
          <label>姓名<input id="personCreateName" required maxlength="40" autocomplete="name" placeholder="请输入老师姓名"></label>
          <label>联系电话<input id="personPhone" required type="tel" inputmode="tel" maxlength="30" autocomplete="tel" placeholder="请输入中国大陆手机号"></label>
          <label>初始登录密码<input id="personInitialPassword" required type="password" minlength="8" maxlength="32" autocomplete="new-password" placeholder="8–32 位，字母/数字开头，至少含三类字符"></label>
        </div>
      </section>

      <section class="hq-create-section person-create-section" aria-label="创建规则">
        <div class="panel-heading">
          <div>
            <h2>账号规则</h2>
          </div>
          <span class="badge">现场拍摄</span>
        </div>
        <div class="teacher-create-rule-grid">
          <article><strong>唯一身份</strong><span>一个手机号只对应一个总部、门店或老师身份</span></article>
          <article><strong>立即激活</strong><span>登录账号与老师主档创建成功后立即可用</span></article>
          <article><strong>考勤验证</strong><span>建档照仅用于老师打卡时的 1:1 验证</span></article>
        </div>
      </section>

      <section class="hq-create-section person-create-section">
        <div class="panel-heading"><div><h2>考勤人脸录入</h2><p>请让老师本人正对前置摄像头；每次打卡的现场照片不会保存。</p></div><span class="badge">创建必填</span></div>
        <div class="customer-camera-stage"><video id="teacherFaceCamera" autoplay muted playsinline hidden></video><img id="teacherFacePreview" alt="老师考勤建档照预览" hidden><div id="teacherFacePlaceholder" class="camera-placeholder"><strong>等待打开摄像头</strong><span>拍摄后可预览，不满意可以重拍。</span></div><canvas id="teacherFaceCanvas" hidden></canvas></div>
        <div id="teacherFaceStatus" class="capture-status pending">尚未拍摄</div>
        <div class="camera-actions"><button id="openTeacherFaceCamera" type="button">打开摄像头</button><button id="captureTeacherFace" type="button" disabled>拍照</button><button id="retakeTeacherFace" type="button" hidden>重新拍照</button></div>
        <label class="consent-row"><input id="teacherFaceConsent" type="checkbox" required> 已取得老师明确授权：保存本次建档照与考勤人脸，仅用于本人打卡身份验证；打卡现场照不保存</label>
      </section>

      <div id="teacherCreateProgress" class="capture-status pending" role="status" aria-live="polite" hidden>
        <strong id="teacherCreateProgressStage">创建尚未开始</strong>
      </div>
      <div class="hq-create-actions">
        <span id="personCreateMessage" aria-live="polite"></span>
        <a class="button-link secondary-button" href="teacher-management.html">返回老师管理</a>
        <button id="createTeacherSubmit" type="submit" disabled aria-disabled="true">创建老师账号</button>
      </div>
    </form>
  </main>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.js"></script><script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.auth.js"></script><script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.functions.js"></script><script src="cloudbase-auth-config.js"></script><script src="cloudbase-phone-auth.js?v=0.20.4"></script><script src="teacher-create.js?v=0.6.0"></script><script src="auth-ui.js?v=0.20.6"></script>
</body>
</html>
