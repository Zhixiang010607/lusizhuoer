<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>产品管理</title>
  <link rel="stylesheet" href="styles.css?v=0.15.50">
</head>
<body data-retail-product-management>
  <aside class="side-project-bar" aria-label="项目栏">
    <div class="side-brand"><span>HQ</span><div><strong>总部工作台</strong><small>项目栏</small></div></div>
    <nav class="side-nav"></nav>
    <div class="side-footer">总部权限</div>
  </aside>
  <header class="topbar">
    <div><p class="eyebrow">PRODUCT MASTER DATA</p><h1>产品管理</h1><p class="subtitle">涂抹类与实物产品主档</p></div>
    <div class="status"><span></span>总部权限</div>
  </header>
  <main class="retail-product-page">
    <section class="panel management-toolbar project-management-toolbar">
      <div><strong>全部产品</strong><span>产品只能封存或重新激活，不能删除</span></div>
      <div class="toolbar-actions"><a class="button-link" href="retail-product-create.html">新增产品</a></div>
    </section>
    <p id="retailProductMessage" class="retail-product-message" role="status" aria-live="polite"></p>

    <section class="panel retail-product-list-card">
      <div class="panel-heading"><div><h2>产品列表</h2></div><span id="retailProductCount" class="badge">0 个产品</span></div>
      <div class="retail-product-table-wrap">
        <table class="retail-product-table">
          <thead><tr><th>产品名称</th><th>产品编号</th><th>状态</th><th>操作</th></tr></thead>
          <tbody id="retailProductBody"><tr><td colspan="4" class="query-empty">正在读取产品数据…</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.js"></script>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.auth.js"></script>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.functions.js"></script>
  <script src="cloudbase-auth-config.js"></script>
  <script src="cloudbase-phone-auth.js?v=0.20.3"></script>
  <script src="retail-product-management.js?v=0.1.1"></script>
  <script src="auth-ui.js?v=0.19.7"></script>
</body>
</html>
