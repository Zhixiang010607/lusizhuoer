<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>总部管理</title>
  <link rel="stylesheet" href="styles.css?v=0.15.44">
  <link rel="stylesheet" href="hq-sms-settings.css?v=1.0.0">
</head>
<body data-management="hq">
  <aside class="side-project-bar" aria-label="项目栏">
    <div class="side-brand"><span>HQ</span><div><strong>总部工作台</strong><small>项目栏</small></div></div>
    <p class="side-section-title">总部管理</p><nav class="side-nav"></nav><div class="side-footer">静态原型</div>
  </aside>
  <header class="topbar"><div><p class="eyebrow">HEADQUARTERS MANAGEMENT</p><h1>总部管理</h1><p class="subtitle">查看、创建和封存总部账号；不提供删除操作</p></div><div class="status"><span></span>总部权限</div></header>
  <main>
    <section class="panel management-toolbar people-search-toolbar">
      <label>按姓名查询<input id="entityNameSearch" type="search" autocomplete="off" placeholder="输入姓名；同名总部人员会全部显示"></label>
      <label>按联系电话查询<input id="entityPhoneSearch" type="search" inputmode="tel" autocomplete="off" placeholder="输入完整或部分联系电话"></label>
      <label>直接选择系统已有总部人员<select id="entitySelect"><option value="">请选择总部人员</option></select></label>
      <div class="toolbar-actions"><button id="searchPeople" type="button">按条件搜索</button><button id="addEntity">新增总部人员</button></div>
    </section>
    <section id="entityInfo" class="management-summary"></section>
    <section id="hqSmsSettings" class="panel hq-sms-settings" hidden>
      <div class="panel-heading"><h2 id="hqSmsTarget">审核短信</h2><button id="hqSmsClose" class="secondary-button" type="button">收起</button></div>
      <p class="sms-description">任何总部账号都可以修改总部人员的接收设置，四项默认不接收。</p>
      <form id="hqSmsForm">
        <div class="sms-setting-row"><div><strong>四类审核提醒</strong><p>产品、充值、退费、补录核销</p><p id="hqSmsPhone"></p></div><div class="sms-category-grid">
          <label class="sms-toggle"><input id="hqSms-purchase" type="checkbox" disabled>产品审核</label>
          <label class="sms-toggle"><input id="hqSms-recharge" type="checkbox" disabled>充值审核</label>
          <label class="sms-toggle"><input id="hqSms-refund" type="checkbox" disabled>退费审核</label>
          <label class="sms-toggle"><input id="hqSms-verification" type="checkbox" disabled>核销审核</label>
        </div></div>
        <p class="sms-description">短信服务准备中，设置会保存，服务启用后生效。封存人员不接收提醒。</p>
        <div class="sms-footer"><button id="hqSmsSave" type="submit" disabled>保存设置</button><span id="hqSmsStatus" role="status" aria-live="polite"></span></div>
      </form>
    </section>
    <section class="panel customer-permission-banner"><strong>总部账号规则</strong><span>一个手机号只能对应一个业务身份。姓名查询会展示所有同名人员；封存后该人员无法登录。</span></section>
  </main>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.js"></script>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.auth.js"></script>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.functions.js"></script>
  <script src="cloudbase-auth-config.js"></script><script src="cloudbase-phone-auth.js?v=0.20.12"></script><script src="datetime.js?v=0.1.2"></script><script src="hq-sms-settings.js?v=1.0.0"></script><script src="management.js?v=0.14.26"></script><script src="auth-ui.js?v=0.21.8"></script>
</body>
</html>
