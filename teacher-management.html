<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>老师管理</title>
  <link rel="stylesheet" href="styles.css?v=0.15.44">
</head>
<body data-management="teacher">
  <aside class="side-project-bar" aria-label="项目栏">
    <div class="side-brand"><span>HQ</span><div><strong>总部工作区</strong><small>项目栏</small></div></div>
    <nav class="side-nav"></nav>
    <div class="side-footer">总部权限</div>
  </aside>
  <header class="topbar">
    <div>
      <p class="eyebrow">TEACHER MANAGEMENT</p>
      <h1>老师管理</h1>
      <p class="subtitle">默认分别显示全部活跃与封存老师；姓名、联系电话可单独或联合查询。</p>
    </div>
    <div class="status"><span></span>总部权限</div>
  </header>
  <main>
    <section class="panel teacher-directory-toolbar">
      <label>按姓名查询<input id="entityNameSearch" type="search" autocomplete="off" placeholder="输入姓名；同名老师会全部显示"></label>
      <label>按联系电话查询<input id="entityPhoneSearch" type="search" inputmode="tel" autocomplete="off" placeholder="输入完整或部分联系电话"></label>
      <div class="toolbar-actions">
        <button id="searchPeople" type="button">查询</button>
        <button id="addEntity" type="button">新增老师</button>
      </div>
    </section>
    <section id="teacherDirectory" class="teacher-directory-grid" aria-live="polite">
      <section class="panel teacher-directory-panel teacher-search-results-panel">
        <div class="panel-heading"><div><h2>查询结果</h2></div><span id="searchTeacherCount" class="badge">0 人</span></div>
        <div class="teacher-directory-window teacher-directory-search-window">
          <table class="teacher-directory-table">
            <colgroup><col class="teacher-name-column"><col class="teacher-code-column"><col class="teacher-phone-column"><col class="teacher-status-column"></colgroup>
            <thead><tr><th>老师姓名</th><th>老师编号</th><th>联系电话</th><th>状态</th></tr></thead>
            <tbody id="searchTeacherRows"><tr><td colspan="4" class="teacher-directory-empty">尚未查询</td></tr></tbody>
          </table>
        </div>
      </section>
      <section class="panel teacher-directory-panel">
        <div class="panel-heading"><div><h2>活跃老师</h2></div><span id="activeTeacherCount" class="badge">0 人</span></div>
        <div class="teacher-directory-window">
          <table class="teacher-directory-table">
            <colgroup><col class="teacher-name-column"><col class="teacher-code-column"><col class="teacher-phone-column"><col class="teacher-status-column"></colgroup>
            <thead><tr><th>老师姓名</th><th>老师编号</th><th>联系电话</th><th>状态</th></tr></thead>
            <tbody id="activeTeacherRows"><tr><td colspan="4" class="teacher-directory-empty">正在读取老师数据…</td></tr></tbody>
          </table>
        </div>
      </section>
      <section class="panel teacher-directory-panel">
        <div class="panel-heading"><div><h2>封存老师</h2></div><span id="archivedTeacherCount" class="badge">0 人</span></div>
        <div class="teacher-directory-window">
          <table class="teacher-directory-table">
            <colgroup><col class="teacher-name-column"><col class="teacher-code-column"><col class="teacher-phone-column"><col class="teacher-status-column"></colgroup>
            <thead><tr><th>老师姓名</th><th>老师编号</th><th>联系电话</th><th>状态</th></tr></thead>
            <tbody id="archivedTeacherRows"><tr><td colspan="4" class="teacher-directory-empty">正在读取老师数据…</td></tr></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.js"></script>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.auth.js"></script>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.functions.js"></script>
  <script src="cloudbase-auth-config.js"></script>
  <script src="cloudbase-phone-auth.js?v=0.17.7"></script>
  <script src="teacher-management.js?v=0.14.23"></script>
  <script src="auth-ui.js?v=0.18.9"></script>
</body>
</html>
