<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>核销审核</title>
  <link rel="stylesheet" href="styles.css?v=0.15.42">
</head>
<body data-review="verification">
  <aside class="side-project-bar" aria-label="项目栏">
    <div class="side-brand"><span>HQ</span><div><strong>总部工作台</strong><small>项目栏</small></div></div>
    <p class="side-section-title">数据看板</p>
    <nav class="side-nav"><a href="index.html"><span class="nav-icon">全</span><span>全局视图</span></a></nav>
    <details class="side-menu-group"><summary><span class="nav-icon">管</span><span>管理</span></summary><nav><a href="project-management.html">产品管理</a><a href="store-management.html">门店管理</a><a href="teacher-management.html">老师管理</a></nav></details>
    <details class="side-menu-group"><summary><span class="nav-icon">查</span><span>查询</span></summary><nav><a href="customer-query.html">客户查询</a><a href="recharge-query.html">充值查询</a><a href="verification-query.html">核销查询</a></nav></details>
    <details class="side-menu-group" open data-menu="review"><summary><span class="nav-icon">审</span><span>审核</span></summary><nav><a href="recharge-review.html">充值审核</a><a class="active" href="verification-review.html">核销审核</a></nav></details>
    <div class="side-footer">总部工作台</div>
  </aside>
  <header class="topbar"><div><p class="eyebrow">VERIFICATION REVIEW</p><h1>核销审核</h1><p class="subtitle">仅补录核销需要总部或运营审核</p></div><div class="status"><span></span>运营审批权限</div></header>
  <main>
    <section class="panel review-toolbar">
      <div class="review-query-mode" role="tablist" aria-label="审核查询方式">
        <button id="reviewModeFilters" class="active" type="button" role="tab" aria-selected="true">按条件查询</button>
        <button id="reviewModeCode" type="button" role="tab" aria-selected="false">按编号查询</button>
      </div>
      <div id="reviewFilterPanel" class="review-filter-row review-query-panel">
        <label>门店<select id="reviewStore"></select></label>
        <label>申请类型<select id="reviewType"><option value="all">全部类型</option><option value="补录">补录申请</option></select></label>
        <label>审核状态<select id="reviewStatus"><option value="all" selected>全部状态</option><option value="pending">待审核</option><option value="approved">已通过</option><option value="rejected">已驳回</option></select></label>
        <button id="reviewFilterSearch" class="primary-action" type="button">按条件查询</button>
      </div>
      <div id="reviewCodePanel" class="review-code-panel review-query-panel" hidden>
        <label>工单编号<input id="reviewCode" type="search" maxlength="40" autocomplete="off" placeholder="输入完整核销单号，例如 VX202608170009"></label>
        <button id="reviewCodeSearch" class="primary-action" type="button">查询</button>
      </div>
      <div class="review-count" id="reviewCount"></div>
    </section>
    <section class="panel table-card review-table">
      <div class="panel-heading"><div><h2>核销审核记录</h2><p>核销作废流程已停用；这里仅处理补录核销申请</p></div><span class="badge">核销</span></div>
      <div class="table-scroll"><table><thead><tr><th>核销单号</th><th>类型</th><th>门店</th><th>客户</th><th>项目</th><th>老师</th><th>次数影响</th><th>提交时间</th><th>审核操作/结果</th><th>审核时间</th></tr></thead><tbody id="reviewBody"></tbody></table></div>
      <div class="form-submit-row"><span></span><button id="reviewLoadMore" type="button" hidden>加载更多审核记录</button></div>
    </section>
  </main>
  <dialog id="reviewDialog">
    <div class="dialog-heading"><h2 id="reviewDialogTitle">审核确认</h2><button id="closeReviewDialog" aria-label="关闭">×</button></div>
    <div id="reviewDialogSummary" class="reviewDialogSummary"></div>
    <div><strong>沟通记录</strong><div id="reviewCommunicationLog" class="communication-log compact-communication-log"></div></div>
    <label>运营留言／审核备注<textarea id="reviewNote" rows="3" maxlength="500" placeholder="可选：填写本次批准或拒绝说明"></textarea></label>
    <div class="dialog-actions"><button id="cancelReview" type="button">取消</button><button id="confirmReview" type="button">确认</button></div>
  </dialog>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.js"></script>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.auth.js"></script>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.functions.js"></script>
  <script src="cloudbase-auth-config.js"></script>
  <script src="cloudbase-phone-auth.js?v=0.17.7"></script>
  <script src="datetime.js?v=0.1.2"></script>
  <script src="review.js?v=0.17.8"></script>
  <script src="auth-ui.js?v=0.18.6"></script>
</body>
</html>
