<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>产品购买审核</title><link rel="stylesheet" href="styles.css?v=0.15.48"></head><body>
<aside class="side-project-bar"><div class="side-brand"><span>HQ</span><div><strong>总部工作台</strong><small>审核</small></div></div><nav class="side-nav"></nav><details data-menu="review" open><summary><span class="nav-icon">审</span><span>审核</span></summary><nav></nav></details></aside>
<header class="topbar"><div><p class="eyebrow">PRODUCT PURCHASE REVIEW</p><h1>产品购买审核</h1><p class="subtitle">独立审核门店与老师提交的产品购买单</p></div></header>
<main class="review-main"><section class="panel review-filters"><div class="review-filter-fields"><label>门店范围<select id="purchaseReviewStore"><option value="">全部门店</option></select></label><label>审核状态<select id="purchaseReviewStatus"><option value="">全部状态</option><option value="PENDING">待审核</option><option value="APPROVED">审核通过</option><option value="REJECTED">已驳回</option></select></label><label>完整工单号<input id="purchaseReviewCode" placeholder="PP20260826000001"></label><button id="purchaseReviewSearch" type="button">查询</button><button id="purchaseReviewReset" type="button" class="secondary-button">重置</button></div><div id="purchaseReviewMessage" class="review-count"></div></section>
<section class="panel table-card review-table"><div class="panel-heading"><div><h2>产品购买审核记录</h2><p>审核通过后才计入客户产品汇总</p></div><span class="badge">产品购买</span></div><div class="table-scroll"><table><thead><tr><th>工单号</th><th>门店</th><th>客户</th><th>产品</th><th>数量</th><th>老师</th><th>提交时间</th><th>审核</th><th>审核时间</th></tr></thead><tbody id="purchaseReviewBody"></tbody></table></div><nav class="review-pagination"><button id="purchaseReviewPrev">上一页</button><span id="purchaseReviewPage">第 1 / 1 页</span><button id="purchaseReviewNext">下一页</button></nav></section></main>
<dialog id="purchaseReviewDialog"><div class="dialog-heading"><h2 id="purchaseReviewDialogTitle">审核产品购买单</h2><button id="purchaseReviewClose">×</button></div><div id="purchaseReviewSummary" class="review-dialog-summary"></div><label>审核留言（可选）<textarea id="purchaseReviewNote" rows="3" maxlength="1000"></textarea></label><div class="dialog-actions"><button id="purchaseReviewCancel">取消</button><button id="purchaseReviewConfirm">确认</button></div></dialog>
<script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.js"></script><script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.auth.js"></script><script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.functions.js"></script><script src="cloudbase-auth-config.js"></script><script src="cloudbase-phone-auth.js?v=0.20.3"></script><script src="datetime.js?v=0.1.2"></script><script src="product-purchase-review.js?v=0.1.0"></script><script src="auth-ui.js?v=0.19.7"></script></body></html>
