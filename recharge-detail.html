<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>充值工单详情</title>
  <link rel="stylesheet" href="styles.css?v=0.15.40">
</head>
<body data-record-detail="recharge">
  <aside class="side-project-bar" aria-label="项目栏">
    <div class="side-brand"><span>HQ</span><div><strong>总部工作台</strong><small>项目栏</small></div></div>
    <p class="side-section-title">数据看板</p>
    <nav class="side-nav"><a href="index.html"><span class="nav-icon">全</span><span>全局视图</span></a></nav>
    <details class="side-menu-group"><summary><span class="nav-icon">管</span><span>管理</span></summary><nav><a href="project-management.html">产品管理</a><a href="store-management.html">门店管理</a><a href="teacher-management.html">老师管理</a></nav></details>
    <details class="side-menu-group" open><summary><span class="nav-icon">查</span><span>查询</span></summary><nav><a href="customer-query.html">客户查询</a><a class="active" href="recharge-query.html">充值查询</a><a href="verification-query.html">核销查询</a></nav></details>
    <details class="side-menu-group" data-menu="review"><summary><span class="nav-icon">审</span><span>审核</span></summary><nav><a href="recharge-review.html">充值审核</a><a href="verification-review.html">核销审核</a></nav></details>
    <div class="side-footer">总部工作台</div>
  </aside>

  <header class="topbar">
    <div><p class="eyebrow">RECHARGE WORK ORDER</p><h1>充值工单详情</h1><p class="subtitle">单笔充值工单</p></div>
    <div class="header-actions order-export-actions">
      <span id="orderExportMessage" class="order-export-message" role="status">工单读取完成后可以导出。</span>
      <button id="exportOrderPdf" class="order-export-button" type="button" disabled>导出 PDF</button>
      <button id="exportOrderImage" class="order-export-button" type="button" disabled>导出图片</button>
      <a class="back-link" href="recharge-query.html">← 返回充值查询</a>
    </div>
  </header>

  <main class="verification-order-main">
    <section class="panel verification-order-hero">
      <div class="verification-order-title"><span id="orderKindTag" class="recharge-type-tag">新充值</span><h2 id="orderTitle">充值单 —</h2><p id="orderDescription">正在读取工单信息…</p></div>
      <div class="verification-order-status"><span>当前审核状态</span><strong id="orderStatus" class="pending">待审核</strong><small id="orderStatusHint">等待总部或运营处理</small></div>
      <div id="orderKeyfacts" class="verification-order-keyfacts"></div>
    </section>

    <section class="verification-order-grid">
      <section class="panel verification-order-details">
        <div class="panel-heading"><div><h2>充值信息</h2><p>该工单实际提交的充值业务内容。</p></div><span class="badge recharge-badge">充值</span></div>
        <div id="orderInfo" class="detail-info-grid verification-order-info recharge-order-info"></div>
      </section>

      <section class="panel verification-order-decision unified-order-review" data-order-review>
        <div class="panel-heading"><div><h2 id="reviewPanelTitle">总部审核</h2><p id="reviewPanelHint">请为本张充值工单选择审核结果。</p></div></div>
        <label id="reviewNoteField" class="verification-order-review-note">总部审核说明（选填）<textarea id="reviewMessage" rows="2" maxlength="500" readonly aria-label="总部审核说明"></textarea></label>
        <div id="reviewActions" class="verification-order-actions"><button id="reviewApprove" type="button" disabled>通过</button><button id="reviewReject" class="reject" type="button" disabled>驳回</button></div>
        <div id="storeVoidAction" class="store-void-action" hidden>
          <label class="void-reason-field">作废说明（必填）<textarea id="voidReason" rows="3" maxlength="500" placeholder="请说明本次作废原因" disabled></textarea></label>
          <div class="void-application-actions"><span id="voidApplicationMessage" class="form-message" aria-live="polite"></span><button id="submitVoidApplication" class="reject" type="button" disabled>提交作废申请</button></div>
        </div>
        <p id="reviewStatusRow" class="unified-review-status">当前审核结果：<strong id="reviewStatus">待审核</strong></p>
      </section>
    </section>

    <section class="panel order-comments-panel">
      <div class="panel-heading"><div><h2>留言记录</h2><p id="orderCommentsHint">原申请和作废申请均按门店／总部保留；未填写内容显示“无”。</p></div><span id="orderCommentsCount" class="badge">4 项</span></div>
      <div id="orderComments" class="order-comment-grid"></div>
    </section>
  </main>

  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.js"></script>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.auth.js"></script>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.functions.js"></script>
  <script src="cloudbase-auth-config.js"></script>
  <script src="cloudbase-phone-auth.js?v=0.17.7"></script>
  <script src="datetime.js?v=0.1.2"></script>
  <script src="order-export.js?v=0.1.1"></script>
  <script src="business-detail.js?v=0.16.6"></script>
  <script src="auth-ui.js?v=0.18.6"></script>
</body>
</html>
