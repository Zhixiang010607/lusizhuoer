<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>系统登录</title><link rel="stylesheet" href="styles.css?v=0.15.59"></head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-form-panel">
      <div class="login-form-wrap">
        <div id="loginWelcomeHeading" class="login-heading"><span class="login-system-mark">HQ</span><h2>登录</h2></div>
        <form id="loginForm" class="login-form" novalidate>
          <label>手机号<input id="loginPhone" autocomplete="tel" inputmode="numeric" maxlength="11" placeholder="请输入中国大陆手机号" required></label>
          <div class="login-method-switch" role="tablist" aria-label="登录方式"><button class="active" id="passwordLoginMode" type="button">密码登录</button><button id="smsLoginMode" type="button">验证码登录</button></div>
          <label id="passwordLoginField">登录密码<span class="password-field"><input id="loginPassword" type="password" autocomplete="current-password" placeholder="请输入登录密码"><button id="togglePassword" type="button" aria-label="显示密码">显示</button></span></label>
          <label id="smsLoginField" hidden>短信验证码<span class="password-field"><input id="loginSmsCode" inputmode="numeric" maxlength="6" placeholder="请输入短信验证码"><button id="sendSmsCode" type="button">获取验证码</button></span></label>
          <div class="login-options"><label><input id="rememberAccount" type="checkbox">记住账号</label><a href="#" id="forgotPassword">修改密码</a></div>
          <p id="loginError" class="login-error" role="alert"></p>
          <button class="login-submit" type="submit">登录系统</button>
        </form>
        <form id="passwordResetForm" class="login-form" novalidate hidden>
          <div class="login-heading"><span class="login-system-mark">HQ</span><h2>修改密码</h2></div>
          <label>手机号<input id="resetPhone" autocomplete="tel" inputmode="numeric" maxlength="11" placeholder="请输入中国大陆手机号" required></label>
          <label>短信验证码<span class="password-field"><input id="resetSmsCode" inputmode="numeric" maxlength="6" placeholder="请输入验证码" required><button id="sendResetSms" type="button">获取验证码</button></span></label>
          <label>新密码<input id="resetNewPassword" type="password" minlength="8" maxlength="32" autocomplete="new-password" placeholder="至少 8 位，含三类字符" required></label>
          <label>确认新密码<input id="resetConfirmPassword" type="password" minlength="8" maxlength="32" autocomplete="new-password" placeholder="请再次输入新密码" required></label>
          <p id="passwordResetMessage" class="login-error" role="alert"></p>
          <button class="login-submit" type="submit">验证并修改密码</button>
          <div class="login-options"><a href="#" id="backToLogin">返回登录</a></div>
        </form>
      </div>
    </section>
  </main>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.js"></script><script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.auth.js"></script><script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.functions.js"></script><script src="cloudbase-auth-config.js"></script><script src="cloudbase-phone-auth.js?v=0.20.3"></script><script src="login.js?v=0.17.4"></script>
</body></html>
