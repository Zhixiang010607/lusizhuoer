<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>门店创建</title><link rel="stylesheet" href="styles.css"></head>
<body data-hq-create="store">
  <aside class="side-project-bar" aria-label="项目栏">
    <div class="side-brand"><span>HQ</span><div><strong>总部工作台</strong><small>项目栏</small></div></div>
    <p class="side-section-title">数据看板</p><nav class="side-nav"><a href="index.html"><span class="nav-icon">全</span><span>全局视图</span></a></nav>
    <div class="side-footer">静态原型 v0.14.19</div>
  </aside>
  <header class="topbar"><div><p class="eyebrow">STORE CREATION</p><h1>门店创建</h1></div><div class="status"><span></span>总部权限</div></header>
  <main class="hq-create-main">
    <form id="storeCreateForm" class="panel hq-create-form">
      <section class="hq-create-section">
        <div class="panel-heading"><div><h2>门店资料</h2></div><span id="generatedStoreCode" class="badge"></span></div>
        <div class="hq-create-grid">
          <label>门店名称<input id="storeCreateName" required maxlength="60" placeholder="请输入门店名称"></label>
          <label>省<select id="storeCreateProvince" required><option value="">请选择省</option></select></label>
          <label>城市<select id="storeCreateCity" required disabled><option value="">请先选择省</option></select></label>
          <label>区<select id="storeCreateDistrict" required disabled><option value="">请先选择城市</option></select></label>
          <label>门店地址<input id="storeCreateAddress" required maxlength="160" placeholder="请输入完整地址"></label>
        </div>
      </section>
      <section class="hq-create-section contact-section">
        <div class="panel-heading"><div><h2>联系人</h2></div><button id="addStoreContact" type="button">添加联系人</button></div>
        <div id="storeContactList" class="store-contact-list"></div>
      </section>
      <div class="hq-create-actions"><span id="storeCreateMessage"></span><a class="button-link secondary-button" href="store-management.html">返回门店管理</a><button type="submit">创建门店</button></div>
    </form>
  </main>
  <script src="china-regions.js"></script><script src="store-create.js"></script><script src="auth-ui.js"></script>
</body>
</html>
