<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>核销办理</title>
  <link rel="stylesheet" href="styles.css?v=0.15.35">
</head>
<body data-store-business="verification">
  <aside class="side-project-bar" aria-label="项目栏">
    <div class="side-brand"><span>HQ</span><div><strong>门店工作区</strong><small>项目栏</small></div></div>
    <p class="side-section-title">门店业务</p>
    <nav class="side-nav"></nav>
    <div class="side-footer">静态原型 v0.14.19</div>
  </aside>
  <header class="topbar">
    <div><p class="eyebrow">SERVICE VERIFICATION</p><h1>核销办理</h1><p class="subtitle">客户确认、项目核销、人脸识别和设备信号</p></div>
    <div class="status"><span></span>人脸核验必需</div>
  </header>
  <main class="store-business-main store-workflow-main">
    <section class="panel store-business-form workflow-lookup-panel">
      <div class="panel-heading"><div><h2>第一步：查找并确认客户</h2></div><span class="badge">客户确认</span></div>
      <div class="lookup-mode-switch" role="tablist" aria-label="客户查找方式"><button class="active" type="button" data-lookup-mode="select">现有客户下拉框＋生日</button><button type="button" data-lookup-mode="manual">手动输入姓名＋生日</button></div>
      <div id="selectLookupFields" class="customer-lookup-grid"><label>现有客户<select id="serviceCustomerSelect"></select></label><label>生日<input id="serviceSelectBirthday" type="date" readonly aria-readonly="true"></label><button id="serviceSelectLookup" type="button">查询客户</button></div>
      <div id="manualLookupFields" class="customer-lookup-grid" hidden><label>客户姓名<input id="serviceCustomerName" placeholder="手动输入客户姓名"></label><label>生日<input id="serviceCustomerBirthday" type="date"></label><button id="serviceCustomerLookup" type="button">查询客户</button></div>
      <div id="serviceCustomerResults" class="service-customer-results customer-core-preview"><div class="lookup-placeholder"><strong>等待查询客户</strong><span>查询成功后，此处显示客户建档照片、姓名、生日和客户编号。</span></div></div>
      <button id="confirmCustomerSelection" class="confirm-customer-button" type="button" disabled>确认此客户并进入核销</button>
    </section>
    <div id="workflowResizeHandle" class="workflow-resize-handle" role="separator" aria-orientation="vertical" aria-label="调整客户确认与核销信息区域宽度" tabindex="0"></div>
    <form id="verificationCreateForm" class="panel store-business-form workflow-action-panel business-step-disabled">
      <div class="panel-heading"><div><h2>第二步：核销信息与人脸识别</h2><p id="selectedCustomerText"></p></div><span class="badge">正常核销</span></div>
      <div class="store-business-grid"><label>项目<select id="verificationProject" required></select></label><label>业务老师<select id="verificationTeacher" required></select></label><label class="full-field">门店备注／留言<textarea id="verificationNote" rows="3" maxlength="500" placeholder="可给当前核销单留言"></textarea></label></div>
      <section class="capture-panel workflow-capture-panel live-verification-panel">
        <div class="verification-camera-stage"><video id="verificationCamera" autoplay muted playsinline hidden></video><img id="verificationPhotoPreview" alt="现场核销人脸照片预览" hidden><div id="verificationCameraPlaceholder" class="camera-placeholder"><strong>等待打开摄像头</strong><span>现场照片只用于与当前所选客户进行 1:1 验证。</span></div><canvas id="verificationCaptureCanvas" hidden></canvas></div>
        <div class="verification-capture-meta"><h3>1:1 人脸验证</h3><p>只验证当前所选客户，不搜索其他客户。</p></div>
        <div class="capture-status-stack"><span id="verificationPhotoStatus" class="capture-status pending">尚未核验</span></div>
        <div class="camera-actions verification-camera-actions"><button id="openVerificationCamera" type="button">打开摄像头</button><button id="captureVerificationPhoto" type="button" disabled>拍照并验证</button><button id="retakeVerificationPhoto" type="button" hidden>重新拍照</button></div>
        <div class="form-submit-row workflow-capture-submit"><span id="verificationCreateMessage"></span><button id="verificationSubmit" type="submit" disabled aria-disabled="true">确认正常核销并开启设备</button></div>
      </section>
    </form>
  </main>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.js"></script>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.auth.js"></script>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.functions.js"></script>
  <script src="cloudbase-auth-config.js"></script>
  <script src="store-business.js?v=0.14.50"></script>
  <script src="auth-ui.js?v=0.18.4"></script>
</body>
</html>
