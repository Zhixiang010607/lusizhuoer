<body data-hq-create="operation" data-person-create="operation"><aside class="side-project-bar" aria-label="项目栏"><div class="side-brand"><span>HQ</span><div><strong>总部工作台</strong><small>项目栏</small></div></div><p class="side-section-title">数据看板</p><nav class="side-nav"><a href="index.html"><span class="nav-icon">全</span><span>全局视图</span></a></nav><div class="side-footer">静态原型 v0.14.19</div></aside>
<header class="topbar"><div><p class="eyebrow">OPERATION CREATION</p><h1>运营创建</h1></div><div class="status"><span></span>总部专属</div></header>
<main class="hq-create-main"><form id="personCreateForm" class="panel hq-create-form person-create-form"><section class="hq-create-section person-create-section"><div class="panel-heading"><div><h2>人员资料</h2><p>填写姓名、手机号和初始密码即可创建登录账号；系统自动生成并绑定用户 ID，一个手机号只能绑定一个业务身份。</p></div><span id="generatedPersonCode" class="badge"></span></div><div class="hq-create-grid"><label>姓名<input id="personCreateName" required maxlength="40" placeholder="请输入姓名"></label><label>联系电话<input id="personPhone" required type="tel" inputmode="tel" maxlength="30" autocomplete="tel" placeholder="请输入中国大陆手机号"></label><label>初始登录密码<input id="personInitialPassword" required type="password" minlength="8" maxlength="32" autocomplete="new-password" placeholder="至少 8 位，含三类字符"></label></div></section><div class="hq-create-actions"><span id="personCreateMessage"></span><a class="button-link secondary-button" href="operation-account-management.html">返回运营管理</a><button type="submit">创建运营账号</button></div></form></main>
