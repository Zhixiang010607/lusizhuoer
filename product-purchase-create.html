<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>产品购买</title><link rel="stylesheet" href="styles.css?v=0.15.49"></head>
<body data-store-business="product-purchase"><aside class="side-project-bar" aria-label="项目栏"><div class="side-brand"><span>店</span><div><strong>业务工作区</strong><small>项目栏</small></div></div><p class="side-section-title">业务办理</p><nav class="side-nav"></nav></aside>
<header class="topbar"><div><p class="eyebrow">PRODUCT PURCHASE</p><h1>产品购买</h1><p class="subtitle">确认客户后选择激活产品和购买数量</p></div><div class="status"><span></span>无需人脸识别</div></header>
<main class="store-business-main store-workflow-main"><section class="panel store-business-form workflow-lookup-panel"><div class="panel-heading"><div><h2>第一步：查找并确认客户</h2></div><span class="badge">本门店 · 活跃</span></div><div class="lookup-mode-switch"><button class="active" type="button" data-lookup-mode="select">现有客户下拉框＋生日</button><button type="button" data-lookup-mode="manual">手动输入姓名或生日</button></div><div id="selectLookupFields" class="customer-lookup-grid"><label>现有客户<select id="serviceCustomerSelect"></select></label><label>生日<input id="serviceSelectBirthday" type="date" readonly></label><button id="serviceSelectLookup" type="button">查询客户</button></div><div id="manualLookupFields" class="customer-lookup-grid" hidden><label>客户姓名<input id="serviceCustomerName"></label><label>生日<input id="serviceCustomerBirthday" type="date"></label><button id="serviceCustomerLookup" type="button">查询客户</button></div><div id="serviceCustomerResults" class="service-customer-results customer-core-preview"><div class="lookup-placeholder"><strong>等待查询客户</strong><span>确认后再填写购买信息。</span></div></div><button id="confirmCustomerSelection" class="confirm-customer-button" type="button" disabled>确认此客户</button></section><div id="workflowResizeHandle" class="workflow-resize-handle" role="separator" aria-orientation="vertical" tabindex="0"></div>
<form id="productPurchaseForm" class="panel store-business-form workflow-action-panel business-step-disabled"><div class="panel-heading"><div><h2>第二步：填写购买信息</h2><p id="selectedCustomerText"></p></div><span class="badge">待总部审核</span></div><div class="store-business-grid"><label>激活产品<select id="purchaseProduct" required></select></label><label>购买数量<input id="purchaseCount" type="number" min="1" max="999" required placeholder="1 至 999"></label><label class="full-field">填报留言（可选）<textarea id="purchaseNote" rows="3" maxlength="500" placeholder="总部审核人员可看到"></textarea></label></div><div class="form-submit-row"><span id="purchaseCreateMessage"></span><button type="submit">提交产品购买申请</button></div></form></main>
<script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.js"></script><script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.auth.js"></script><script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.functions.js"></script><script src="cloudbase-auth-config.js"></script><script src="store-business.js?v=0.14.62"></script><script src="auth-ui.js?v=0.19.7"></script></body></html>
