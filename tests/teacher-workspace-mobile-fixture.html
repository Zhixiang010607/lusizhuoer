<!doctype html>
<html lang="zh-CN" data-auth-ready>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>老师主页紧凑布局</title>
  <link rel="stylesheet" href="../styles.css?v=0.15.59">
</head>
<body data-teacher-workspace>
  <header class="topbar"><div><h1>我的工作台</h1></div></header>
  <main class="teacher-workspace-main">
    <section class="panel detail-section teacher-profile-panel">
      <div class="panel-heading"><div><h2>我的基础信息</h2></div></div>
      <div id="teacherProfileInfo" class="detail-info-grid">
        <article><span>老师姓名</span><strong>叶吴老师</strong></article>
        <article><span>老师短编号</span><strong>T420</strong></article>
      </div>
    </section>
    <section class="panel teacher-quota-panel">
      <div class="panel-heading"><div><h2>体验项目剩余次数</h2></div><span class="badge">2 个项目</span></div>
      <div class="teacher-quota-grid">
        <article class="teacher-quota-card">
          <div><strong>海洋之蕴深度护理项目</strong><small>PRD001</small></div>
          <p><b>30</b><span>次可用</span></p>
          <dl><div><dt>每月基础</dt><dd>30 次</dd></div><div><dt>本月已用</dt><dd>0 次</dd></div></dl>
        </article>
        <article class="teacher-quota-card">
          <div><strong>魔法柔肤</strong><small>PRD002</small></div>
          <p><b>18</b><span>次可用</span></p>
          <dl><div><dt>每月基础</dt><dd>30 次</dd></div><div><dt>本月已用</dt><dd>12 次</dd></div></dl>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
