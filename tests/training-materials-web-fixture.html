<!doctype html>
<html lang="zh-CN" data-auth-ready="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>培训学习版式验收</title>
  <link rel="stylesheet" href="../styles.css?v=0.15.60">
  <link rel="stylesheet" href="../training-materials.css?v=0.1.0">
</head>
<body data-training-materials>
  <aside class="side-project-bar" aria-label="项目栏">
    <div class="side-brand"><span>HQ</span><div><strong>总部工作区</strong><small>项目栏</small></div></div>
    <nav class="side-nav"><a href="#">全局视图</a></nav>
    <details class="side-menu-group" open><summary><span class="nav-icon">管</span><span>管理</span></summary><nav><a class="active" href="#">培训学习</a></nav></details>
    <div class="side-footer"><span>总部账号</span><button type="button">退出登录</button></div>
  </aside>
  <header class="topbar"><div><h1>培训学习</h1></div></header>
  <main class="training-main">
    <section class="panel training-upload-panel">
      <div class="panel-heading"><div><h2>发布资料</h2></div></div>
      <form class="training-upload-form">
        <label><span>标题</span><input value="服务标准培训" aria-label="标题"></label>
        <label class="training-file-field"><span>PDF 文件</span><input class="training-file-input" type="file" accept="application/pdf,.pdf" aria-label="PDF 文件"><span class="training-file-picker">选择 PDF</span></label>
        <button type="button">上传并发布</button>
      </form>
    </section>
    <section class="panel training-library-panel">
      <div class="training-library-heading"><h2>学习资料</h2><span class="badge">2 份</span></div>
      <form class="training-search-form"><input placeholder="按标题搜索"><button type="button">搜索</button></form>
      <div class="training-list">
        <article class="training-row"><div class="training-row-main"><strong class="training-row-title">服务标准培训</strong><span class="training-row-meta">2026-10-12 · 2.4 MB</span></div><div class="training-row-actions"><button class="training-read" type="button">阅读全文</button><button class="training-status" type="button">删除</button></div></article>
        <article class="training-row"><div class="training-row-main"><strong class="training-row-title">新员工培训手册</strong><span class="training-row-meta">2026-10-11 · 860 KB</span></div><div class="training-row-actions"><button class="training-read" type="button">阅读全文</button><button class="training-status" type="button">删除</button></div></article>
      </div>
    </section>
  </main>
</body>
</html>
