<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>办卡充值</title><link rel="stylesheet" href="styles.css?v=0.15.39"></head>
<body data-store-business="recharge"><aside class="side-project-bar" aria-label="项目栏"><div class="side-brand"><span>HQ</span><div><strong>门店工作区</strong><small>项目栏</small></div></div><p class="side-section-title">门店业务</p><nav class="side-nav"></nav><div class="side-footer">静态原型 v0.14.19</div></aside>
<header class="topbar"><div><p class="eyebrow">MEMBERSHIP RECHARGE</p><h1>办卡充值</h1><p class="subtitle">确认本门店活跃客户后，选择项目、可选业务老师和充值次数</p></div><div class="status"><span></span>无需人脸识别</div></header>
<main class="store-business-main store-workflow-main"><section class="panel store-business-form workflow-lookup-panel"><div class="panel-heading"><div><h2>第一步：查找并确认客户</h2></div><span class="badge">本门店 · 活跃</span></div><div class="lookup-mode-switch" role="tablist" aria-label="客户查找方式"><button class="active" type="button" data-lookup-mode="select">现有客户下拉框＋生日</button><button type="button" data-lookup-mode="manual">手动输入姓名＋生日</button></div><div id="selectLookupFields" class="customer-lookup-grid"><label>现有客户<select id="serviceCustomerSelect"></select></label><label>生日<input id="serviceSelectBirthday" type="date" readonly aria-readonly="true"></label><button id="serviceSelectLookup" type="button">查询客户</button></div><div id="manualLookupFields" class="customer-lookup-grid" hidden><label>客户姓名<input id="serviceCustomerName" placeholder="手动输入客户姓名"></label><label>生日<input id="serviceCustomerBirthday" type="date"></label><button id="serviceCustomerLookup" type="button">查询客户</button></div><div id="serviceCustomerResults" class="service-customer-results customer-core-preview"><div class="lookup-placeholder"><strong>等待查询客户</strong><span>查询成功后，此处显示客户建档照片、姓名、生日和客户编号。</span></div></div><button id="confirmCustomerSelection" class="confirm-customer-button" type="button" disabled>确认此客户并进入充值</button></section><div id="workflowResizeHandle" class="workflow-resize-handle" role="separator" aria-orientation="vertical" aria-label="调整客户确认与充值信息区域宽度" tabindex="0"></div>
<form id="rechargeCreateForm" class="panel store-business-form workflow-action-panel business-step-disabled"><div class="panel-heading"><div><h2>第二步：填写充值信息</h2><p id="selectedCustomerText"></p></div><span class="badge">充值</span></div><div class="store-business-grid"><label>项目<select id="rechargeProject" required></select></label><label>业务老师（选填）<select id="rechargeTeacher"></select></label><label>充值次数<input id="rechargeCount" type="number" min="1" max="999" value="10" required></label><label class="full-field">门店留言<textarea id="rechargeNote" rows="3" maxlength="500" placeholder="可给审核人员留言，留言将保存在当前充值单沟通记录中"></textarea></label></div><div class="form-submit-row"><span id="rechargeCreateMessage"></span><button type="submit">提交充值申请</button></div></form></main><script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.js"></script><script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.auth.js"></script><script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.functions.js"></script><script src="cloudbase-auth-config.js"></script><script src="store-business.js?v=0.14.51"></script><script src="auth-ui.js?v=0.18.5"></script></body></html>
