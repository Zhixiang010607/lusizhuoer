<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老师办理核销</title><link rel="stylesheet" href="styles.css"></head>
<body data-teacher-service="verification"><aside class="side-project-bar" aria-label="老师工作台"><div class="side-brand"><span>师</span><div><strong>老师工作台</strong><small>个人业务</small></div></div><p class="side-section-title">业务办理</p><nav class="side-nav"><a href="teacher-work-orders.html"><span class="nav-icon">单</span><span>我的业务工单</span></a></nav><div class="side-footer">老师账号</div></aside>
<header class="topbar"><div><p class="eyebrow">TEACHER VERIFICATION</p><h1>办理核销</h1><p class="subtitle">先核对门店，再查找客户并完成人脸核验</p></div><div class="status"><span></span>老师本人办理</div></header>
<main class="teacher-service-main"><section class="teacher-privacy-banner"><i>✓</i><div><strong>临时门店选择</strong><br>本次办理必须先搜索并核对门店；门店仅用于本条业务绑定，不会成为老师的默认门店，也不会出现在老师工单列表中。</div></section>
<section id="teacherStoreStep" class="panel teacher-service-panel"><div class="panel-heading"><div><h2>第一步：搜索并核对门店</h2><p>核对无误后才能查找该门店客户</p></div><span id="teacherStoreState" class="badge">尚未选择</span></div><div class="lookup-mode-switch"><button class="active" type="button" data-store-mode="select">现有门店选择</button><button type="button" data-store-mode="manual">名称＋省市区搜索</button></div><div id="teacherSelectStoreFields" class="teacher-store-select-grid"><label>现有门店<select id="teacherStoreSelect"></select></label><button id="teacherSelectStore" type="button">核对门店</button></div><div id="teacherManualStoreFields" class="teacher-store-lookup-grid" hidden><label>门店名称<input id="teacherStoreName" maxlength="60" placeholder="请输入门店名称"></label><label>省<select id="teacherStoreProvince"><option value="">请选择省</option></select></label><label>城市<select id="teacherStoreCity" disabled><option value="">请先选择省</option></select></label><label>区<select id="teacherStoreDistrict" disabled><option value="">请先选择城市</option></select></label><button id="teacherLookupStore" type="button">搜索并核对</button></div><p id="teacherStoreMessage" class="form-message"></p></section>
<section id="teacherCustomerStep" class="panel teacher-service-panel teacher-step-disabled"><div class="panel-heading"><div><h2>第二步：查找并确认客户</h2><p>仅查询本次已核对门店内的客户</p></div><span class="badge">客户确认</span></div><div class="lookup-mode-switch"><button class="active" type="button" data-customer-mode="select">现有客户＋生日</button><button type="button" data-customer-mode="manual">姓名＋生日</button></div><div id="teacherSelectCustomerFields" class="customer-lookup-grid"><label>现有客户<select id="teacherCustomerSelect"></select></label><label>生日<input id="teacherSelectBirthday" type="date" readonly></label><button id="teacherSelectCustomer" type="button">查询客户</button></div><div id="teacherManualCustomerFields" class="customer-lookup-grid" hidden><label>客户姓名<input id="teacherCustomerName" maxlength="40" placeholder="请输入客户姓名"></label><label>生日<input id="teacherCustomerBirthday" type="date"></label><button id="teacherManualCustomer" type="button">查询客户</button></div><div id="teacherCustomerPreview" class="service-customer-results customer-core-preview"><div class="lookup-placeholder"><strong>等待查询客户</strong><span>请先完成门店核对。</span></div></div><button id="teacherConfirmCustomer" class="confirm-customer-button" type="button" disabled>确认此客户</button></section>
<form id="teacherServiceForm" class="panel teacher-service-panel teacher-step-disabled"><div class="panel-heading"><div><h2>第三步：核销信息与人脸识别</h2><p id="teacherSelectedCustomer"></p></div><span class="badge">正常核销</span></div><div class="store-business-grid"><label>项目<select id="teacherProject" required><option value="">请选择项目</option></select></label><label>业务老师<input id="teacherName" readonly></label><label class="full-field">备注／留言<textarea id="teacherNote" rows="3" maxlength="500" placeholder="可选"></textarea></label></div><section class="capture-panel workflow-capture-panel"><div><h3>人脸识别核验</h3></div><div class="capture-status-stack"><span id="teacherFaceStatus" class="capture-status pending">尚未核验</span></div><button id="teacherCaptureFace" type="button">启动人脸识别</button><div class="form-submit-row workflow-capture-submit"><span id="teacherServiceMessage"></span><button type="submit">确认核销并提交</button></div></section></form>
<dialog id="teacherStoreDialog"><div class="dialog-heading"><h2>请核对门店信息</h2><button id="closeTeacherStoreDialog" type="button" aria-label="关闭">×</button></div><div id="teacherStorePreview" class="management-summary"></div><div class="dialog-actions"><button id="confirmTeacherStore" type="button">核对无误，选择此门店</button></div></dialog></main>
<script src="china-regions.js"></script><script src="teacher-service.js"></script><script src="auth-ui.js"></script></body></html>
