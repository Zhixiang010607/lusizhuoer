<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>运营全局视图</title>
  <link rel="stylesheet" href="styles.css?v=0.15.32">
</head>
<body data-operation-home>
  <aside class="side-project-bar" aria-label="项目栏">
    <div class="side-brand"><span>运</span><div><strong>运营工作区</strong><small>个人工作台</small></div></div>
    <p class="side-section-title">工作台</p>
    <nav class="side-nav">
      <a class="active" href="local.html"><span class="nav-icon">全</span><span>全局视图</span></a>
    </nav>
    <details class="side-menu-group" open data-menu="review">
      <summary><span class="nav-icon">审</span><span>审核</span></summary>
      <nav><a href="recharge-review.html">充值审核</a><a href="verification-review.html">核销审核</a></nav>
    </details>
    <div class="side-footer">运营工作区</div>
  </aside>

  <header class="topbar">
    <div>
      <p class="eyebrow">OPERATION ACCOUNT</p>
      <h1>运营全局视图</h1>
      <p class="subtitle">仅显示当前登录运营账号的本人资料。</p>
    </div>
    <div class="status"><span></span>运营权限</div>
  </header>

  <main class="operation-home-main">
    <section class="panel operation-profile-panel" aria-labelledby="operationProfileTitle">
      <div class="panel-heading">
        <div><h2 id="operationProfileTitle">我的个人信息</h2></div>
        <span class="badge">本人资料</span>
      </div>
      <p id="operationProfileStatus" class="operation-profile-status" role="status">正在读取当前运营账号资料…</p>
      <div class="operation-profile-grid">
        <article><span>运营编号</span><strong id="operationStaffCode">—</strong></article>
        <article><span>姓名</span><strong id="operationStaffName">—</strong></article>
        <article><span>联系电话</span><strong id="operationPhone">—</strong></article>
        <article><span>身份</span><strong id="operationRole">运营</strong></article>
        <article><span>账号状态</span><strong id="operationAccountStatus">—</strong></article>
        <article><span>本次登录时间</span><strong id="operationLoginAt">—</strong></article>
      </div>
    </section>

    <section class="panel operation-review-panel" aria-labelledby="operationReviewTitle">
      <div class="panel-heading"><div><h2 id="operationReviewTitle">审核工作台</h2></div></div>
      <div class="operation-review-shortcuts">
        <a class="operation-review-card recharge" href="recharge-review.html">
          <span class="operation-review-icon">充</span>
          <span><strong>充值审核</strong><small>查看并处理充值审核工单</small></span>
          <b aria-hidden="true">→</b>
        </a>
        <a class="operation-review-card verification" href="verification-review.html">
          <span class="operation-review-icon">核</span>
          <span><strong>核销审核</strong><small>查看并处理核销审核工单</small></span>
          <b aria-hidden="true">→</b>
        </a>
      </div>
    </section>
  </main>

  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.js"></script>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.auth.js"></script>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.functions.js"></script>
  <script src="cloudbase-auth-config.js"></script>
  <script src="cloudbase-phone-auth.js?v=0.17.6"></script>
  <script src="datetime.js?v=0.1.0"></script>
  <script src="auth-ui.js?v=0.18.3"></script>
  <script src="operation-home.js?v=0.1.0"></script>
</body>
</html>
