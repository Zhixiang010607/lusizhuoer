<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>修改密码</title>
  <link rel="stylesheet" href="styles.css?v=0.15.39">
</head>
<body data-change-password>
  <aside class="side-project-bar" aria-label="项目栏">
    <div class="side-brand"><span>HQ</span><div><strong>账户设置</strong><small>登录安全</small></div></div>
    <nav class="side-nav"><a href="index.html"><span class="nav-icon">返</span><span>返回工作台</span></a></nav>
    <div class="side-footer"></div>
  </aside>
  <header class="topbar"><div><p class="eyebrow">ACCOUNT SECURITY</p><h1>修改登录密码</h1><p class="subtitle">新密码仅由 CloudBase 身份认证保存；业务数据库不保存明文密码。</p></div></header>
  <main class="hq-create-main">
    <form id="changePasswordForm" class="panel hq-create-form" novalidate>
      <section class="hq-create-section">
        <div class="panel-heading"><div><h2>设置新密码</h2><p>密码为 8–32 位，且须包含大写、小写、数字、特殊字符中的至少三类。</p></div></div>
        <div class="hq-create-grid">
          <label>新密码<input id="newPassword" type="password" minlength="8" maxlength="32" autocomplete="new-password" required placeholder="请输入新密码"></label>
          <label>确认新密码<input id="confirmPassword" type="password" minlength="8" maxlength="32" autocomplete="new-password" required placeholder="请再次输入新密码"></label>
        </div>
      </section>
      <div class="hq-create-actions"><span id="changePasswordMessage" role="status"></span><button type="submit">保存新密码</button></div>
    </form>
  </main>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.js"></script>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.auth.js"></script>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.functions.js"></script>
  <script src="cloudbase-auth-config.js"></script><script src="cloudbase-phone-auth.js?v=0.17.7"></script>
  <script src="auth-ui.js?v=0.18.5"></script><script src="change-password.js"></script>
</body>
</html>
