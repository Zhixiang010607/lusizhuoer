<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>客户查询</title><link rel="stylesheet" href="styles.css?v=0.15.41"></head>
<body data-customer-query>
  <aside class="side-project-bar" aria-label="项目栏">
    <div class="side-brand"><span>HQ</span><div><strong>总部工作台</strong><small>项目栏</small></div></div><p class="side-section-title">数据看板</p>
    <nav class="side-nav"><a href="index.html"><span class="nav-icon">全</span><span>全局视图</span></a></nav>
    <details class="side-menu-group"><summary><span class="nav-icon">管</span><span>管理</span></summary><nav><a href="project-management.html">产品管理</a><a href="store-management.html">门店管理</a><a href="teacher-management.html">老师管理</a></nav></details>
    <details class="side-menu-group" open><summary><span class="nav-icon">查</span><span>查询</span></summary><nav><a class="active" href="customer-query.html">客户查询</a><a href="recharge-query.html">充值查询</a><a href="verification-query.html">核销查询</a></nav></details>
    <details class="side-menu-group" data-menu="review"><summary><span class="nav-icon">审</span><span>审核</span></summary><nav><a href="recharge-review.html">充值审核</a><a href="verification-review.html">核销审核</a></nav></details><div class="side-footer">静态原型 v0.14.19</div>
  </aside>
  <header class="topbar"><div><p class="eyebrow">CUSTOMER QUERY</p><h1>客户查询</h1><p class="subtitle">选择现有客户，或按姓名和生日查询</p></div><div class="status"><span></span>仅允许存档与恢复为活跃</div></header>
  <main>
    <section class="panel query-filter-panel">
      <div class="panel-heading"><div><h2>查询条件</h2></div><span id="customerScopeBadge" class="badge">本门店范围</span></div>
      <div class="query-filter-grid customer-query-filters">
        <div class="customer-query-toolbar">
          <div class="customer-query-store-context" aria-label="查询门店范围"><span id="customerScopeLabel">当前门店</span><strong id="customerStoreName">正在读取门店信息</strong><select id="customerStoreScope" aria-label="选择查询门店" hidden><option value="ALL">全部门店</option></select></div>
          <div class="customer-query-toolbar-actions"><button id="runCustomerQuery" type="button">查询客户</button><button id="resetCustomerQuery" type="button">重置查询</button></div>
          <span id="customerSummary" class="customer-query-summary"></span>
        </div>
        <p id="customerQueryNotice" class="customer-query-notice" aria-live="polite"></p>
        <div class="customer-query-methods" aria-label="客户查询方式">
          <section id="customerSelectPanel" class="customer-query-method active" data-customer-query-panel="select">
            <button class="customer-query-method-heading" type="button" data-customer-query-mode="select"><span>方式一</span><strong id="customerBrowseTitle">筛选本门店全部客户</strong><small>按业务阶段、状态及建档时间筛选</small></button>
            <div class="customer-query-row customer-query-stage-row">
              <label>业务阶段<select id="customerCategory"><option value="all">全部客户</option><option value="registered">有信息但没有充值</option><option value="charged">已充值但没有消费</option><option value="consumed">已充值并已有消费</option></select></label>
              <label>客户状态<select id="customerArchive"><option value="all">全部</option><option value="active">活跃</option><option value="archived">已存档</option></select></label>
            </div>
            <div class="customer-query-row customer-query-time-row">
              <label>时间范围<select id="customerTimeRange"><option value="all" selected>全部时间</option><option value="sevenDays">近 7 天</option><option value="month">近 1 个月</option><option value="quarter">本季度</option><option value="year">本年度</option><option value="custom">自定义日期</option></select></label>
              <label>开始日期<input id="customerDateStart" type="date"></label>
              <label>结束日期<input id="customerDateEnd" type="date"></label>
            </div>
          </section>
          <section id="customerManualPanel" class="customer-query-method" data-customer-query-panel="manual">
            <button class="customer-query-method-heading" type="button" data-customer-query-mode="manual"><span>方式二</span><strong>按姓名＋生日查询</strong><small>可单独填写一项，也可以联合查询</small></button>
            <div class="customer-query-method-fields">
              <label id="customerManualNameField">客户姓名<input id="customerName" placeholder="输入姓名；同名客户全部显示"></label>
              <label id="customerManualBirthdayField">生日<input id="customerBirthday" type="date"></label>
            </div>
          </section>
        </div>
      </div>
    </section>
    <section id="customerCategoryGrid" class="customer-category-grid four-cards" aria-label="客户业务分类"></section>
    <section class="panel customer-permission-banner"><strong id="customerPermissionTitle">门店权限</strong><span id="customerPermissionText">仅允许存档或恢复为活跃。</span></section>
    <section class="panel table-card"><div class="panel-heading"><div><h2>客户结果</h2></div><div class="record-query-pager"><button id="customerPreviousPage" type="button">上一页</button><span id="customerPageLabel">第 1 页</span><button id="customerNextPage" type="button">下一页</button></div></div><div class="table-scroll"><table class="customer-results-table"><colgroup><col class="customer-col-code"><col class="customer-col-name"><col class="customer-col-birthday"><col class="customer-col-store"><col class="customer-col-stage"><col class="customer-col-count"><col class="customer-col-count"><col class="customer-col-status"><col class="customer-col-action"></colgroup><thead><tr><th>客户编号</th><th>客户姓名</th><th>生日</th><th>门店</th><th>业务阶段</th><th>充值次数</th><th>核销次数</th><th>客户状态</th><th>操作</th></tr></thead><tbody id="customerQueryBody"></tbody></table></div></section>
  </main>
  <dialog id="customerActionDialog"><div class="dialog-heading"><h2 id="customerActionTitle">客户状态变更</h2><button id="closeCustomerAction" aria-label="关闭">×</button></div><p id="customerActionText"></p><p class="field-lock-note">本操作只改变客户档案状态，不删除或修改任何客户资料、充值、核销、照片、版本或审计记录。</p><div class="dialog-actions"><button id="cancelCustomerAction" type="button">取消</button><button id="confirmCustomerAction" type="button">确认状态变更</button></div></dialog>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.js"></script><script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.auth.js"></script><script src="https://static.cloudbase.net/cloudbase-js-sdk/3.7.1/cloudbase.functions.js"></script><script src="cloudbase-auth-config.js"></script><script src="cloudbase-phone-auth.js?v=0.17.7"></script><script src="customer-query.js?v=0.15.3"></script><script src="auth-ui.js?v=0.18.6"></script>
</body></html>
